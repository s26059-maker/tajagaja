<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>연습 - 타자가자</title>
  <link href="https://fonts.googleapis.com/css2?family=Gugi&family=Do+Hyeon&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="aurora"><i></i><i></i><i></i></div>
  <canvas id="confetti"></canvas>

  <main class="container">
    <div class="topbar"><a class="back" href="/">← 목록으로</a></div>
    <h1 class="title" id="title"></h1>

    <div class="progress"><div id="bar"></div></div>
    <p id="origin"></p>
    <textarea id="input" rows="3" placeholder="여기에 따라 치세요" autofocus></textarea>

    <div class="stats">
      <div class="stat"><b><span id="acc">0</span><span class="unit">%</span></b><small>정확도</small></div>
      <div class="stat"><b id="cpm">0</b><small>타수 (분당)</small></div>
      <div class="stat"><b><span id="time">0</span><span class="unit">초</span></b><small>경과 시간</small></div>
    </div>

    <div id="result" hidden>
      <h2>RESULT</h2>
      <div class="grade" id="grade">A</div>
      <p class="grade-msg" id="grade-msg"></p>
      <div class="result-grid">
        <div><b><span id="r-acc">0</span>%</b><small>정확도</small></div>
        <div><b id="r-cpm">0</b><small>타수</small></div>
        <div><b id="r-typo">0</b><small>오타(개)</small></div>
      </div>
      <button onclick="location.reload()">다시 하기</button>
    </div>
  </main>

  <script src="/js/practice.js"></script>
</body>
</html>
