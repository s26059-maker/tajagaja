<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>타자가자</title>
  <link href="https://fonts.googleapis.com/css2?family=Gugi&family=Do+Hyeon&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="aurora"><i></i><i></i><i></i></div>

  <main class="container">
    <header class="hero">
      <span class="eyebrow">TYPING PRACTICE</span>
      <h1>타자가자</h1>
      <p class="tagline" id="tagline"></p>
      <div class="chips">
        <span class="chip">실시간 정확도</span>
        <span class="chip">서버 채점</span>
        <span class="chip">내 글로 연습</span>
      </div>
    </header>

    <section class="card">
      <h2>연습할 글 고르기</h2>
      <p class="sub">마음에 드는 글을 골라 바로 시작하세요.</p>
      <ul id="text-list"></ul>
    </section>

    <section class="card">
      <h2>내 글로 연습하기</h2>
      <p class="sub">좋아하는 문장, 가사, 발표문 무엇이든 붙여넣어 보세요.</p>
      <input id="title" placeholder="제목 (안 쓰면 '내 글')">
      <textarea id="content" rows="5" placeholder="따라 칠 글을 붙여넣으세요"></textarea>
      <button id="add-btn">추가하고 연습하기</button>
    </section>
  </main>

  <script src="/js/main.js"></script>
</body>
</html>
